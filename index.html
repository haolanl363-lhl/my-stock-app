<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>投资错题本</title>

<style>

*{
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,
"PingFang SC","Microsoft YaHei";
}

body{
margin:0;
background:#f5f5f7;
color:#1d1d1f;
}


.container{
max-width:900px;
margin:auto;
padding:25px;
}


h1{
font-size:36px;
}



.card{

background:white;
border-radius:25px;
padding:25px;
margin-top:20px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);

}



.number{

font-size:42px;
font-weight:700;

}



.gray{

color:#86868b;

}



.grid{

display:grid;
grid-template-columns:
repeat(3,1fr);

gap:15px;

}



input,textarea,select{

width:100%;
padding:15px;

border-radius:15px;

border:1px solid #ddd;

margin-top:10px;

font-size:16px;

}



textarea{

height:100px;

}



button{

background:#007aff;

color:white;

border:none;

padding:15px;

border-radius:20px;

width:100%;

font-size:17px;

margin-top:15px;

}



.item{

padding:20px;

border-radius:20px;

background:#f5f5f7;

margin-top:15px;

}



.red{

color:#ff3b30;

}



.green{

color:#34c759;

}



@media(max-width:600px){

.grid{

grid-template-columns:1fr;

}

}



</style>


</head>


<body>


<div class="container">


<h1>
📒 投资错题本
</h1>



<div class="grid">


<div class="card">

<div class="gray">
错误数量
</div>

<div class="number" id="count">
0
</div>


</div>



<div class="card">

<div class="gray">
总亏损
</div>

<div class="number red" id="loss">
0
</div>


</div>



<div class="card">

<div class="gray">
复盘次数
</div>

<div class="number">
0
</div>


</div>


</div>





<div class="card">


<h2>
新增错误
</h2>


<input id="name"
placeholder="股票名称">

<input id="money"
placeholder="亏损金额">


<select id="type">

<option>
追涨买入
</option>

<option>
恐慌卖出
</option>

<option>
仓位过重
</option>

<option>
没有研究公司
</option>

<option>
情绪交易
</option>

</select>



<textarea id="reason"
placeholder="错误原因">

</textarea>



<textarea id="change"
placeholder="以后如何改进">

</textarea>



<button onclick="add()">

保存错误

</button>



</div>






<div class="card">

<h2>
我的错误记录
</h2>


<div id="list">

</div>


</div>




</div>






<script>


let data=
JSON.parse(localStorage.getItem("mistakes"))
||[];



function save(){

localStorage.setItem(
"mistakes",
JSON.stringify(data)
);

}



function render(){


let list=
document.getElementById("list");


list.innerHTML="";


let loss=0;


data.forEach((x,i)=>{


loss+=Number(x.money)||0;


list.innerHTML+=`

<div class="item">

<h3>${x.name}</h3>

<p>
类型：
${x.type}
</p>


<p>
亏损：
<span class="red">
¥${x.money}
</span>
</p>


<p>
原因：
${x.reason}
</p>


<p>
改进：
${x.change}
</p>


<button onclick="del(${i})">

删除

</button>


</div>

`;

});


document.getElementById("count")
.innerHTML=data.length;


document.getElementById("loss")
.innerHTML="¥"+loss;


}



function add(){


let obj={

name:
document.getElementById("name").value,


money:
document.getElementById("money").value,


type:
document.getElementById("type").value,


reason:
document.getElementById("reason").value,


change:
document.getElementById("change").value

};



data.push(obj);


save();


render();



}



function del(i){

data.splice(i,1);

save();

render();

}



render();


</script>



</body>

</html>
