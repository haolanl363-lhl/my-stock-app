<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Invest</title>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>

body{

margin:0;

background:#f5f5f7;

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"PingFang SC";

color:#1d1d1f;

}


.container{

padding:25px;

max-width:900px;

margin:auto;

}



h1{

font-size:36px;

}



.card{

background:white;

border-radius:25px;

padding:25px;

margin-top:20px;

box-shadow:
0 8px 30px rgba(0,0,0,.08);

}



.number{

font-size:42px;

font-weight:700;

}



.gray{

color:#888;

}


.green{

color:#34c759;

}



.grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:15px;

}



.stock{

display:flex;

justify-content:space-between;

padding:15px 0;

border-bottom:
1px solid #eee;

}



button{

background:#007aff;

color:white;

border:0;

padding:12px 25px;

border-radius:20px;

}



</style>


</head>


<body>


<div class="container">


<h1>
My Invest
</h1>


<div class="card">

<div class="gray">
总资产
</div>

<div class="number">
¥1,258,600
</div>


<p class="green">
▲ 今日收益 +3280
</p>


</div>



<div class="grid">


<div class="card">

<div class="gray">
年收益率
</div>

<h2 class="green">
18.6%
</h2>

</div>



<div class="card">

<div class="gray">
风险等级
</div>

<h2>
稳健
</h2>

</div>



</div>





<div class="card">

<h2>
资产增长
</h2>


<canvas id="chart"></canvas>


</div>





<div class="card">


<h2>
我的持仓
</h2>


<div class="stock">

<span>
沪深300ETF
</span>

<b class="green">
+12.5%
</b>

</div>



<div class="stock">

<span>
纳斯达克100
</span>

<b class="green">
+21.3%
</b>

</div>



<div class="stock">

<span>
黄金ETF
</span>

<b>
-2.1%
</b>

</div>



</div>



</div>



<script>


new Chart(
document.getElementById("chart"),

{

type:"line",

data:{


labels:[
"1月",
"2月",
"3月",
"4月",
"5月",
"6月"
],


datasets:[{

data:[
800000,
900000,
1000000,
1100000,
1180000,
1258600
],

borderWidth:3,

tension:.4

}]


},


options:{

plugins:{

legend:{
display:false
}

}

}


}

);


</script>



</body>

</html>
