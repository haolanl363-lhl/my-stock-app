<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Investment Mistake Book Pro</title>


<link rel="stylesheet" href="style.css">


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>



<body>


<div class="app">


<!-- 顶部 -->

<header class="topbar">


<div>

<h1>
Investment Journal
</h1>

<p>
投资错题本 Pro
</p>

</div>


<div class="avatar">

投资者

</div>


</header>





<!-- 投资评分 -->


<section class="hero card">


<div>

<p class="small">

投资能力评分

</p>


<h2 id="score">

82

</h2>


<p>

根据你的投资错误自动分析

</p>


</div>



<div class="circle">

<div>

82%

</div>

</div>



</section>








<!-- 数据 -->


<section class="dashboard-grid">


<div class="card">

<p>
错误次数
</p>

<h2 id="totalMistake">
0
</h2>


</div>



<div class="card">

<p>
累计亏损
</p>

<h2 class="danger" id="totalLoss">

¥0

</h2>


</div>




<div class="card">


<p>
已解决

</p>


<h2 class="success">

0

</h2>



</div>




<div class="card">

<p>
复盘完成率

</p>


<h2>

76%

</h2>


</div>


</section>









<!-- 图表 -->


<section class="card chart-box">


<h2>

错误趋势分析

</h2>


<canvas id="mistakeChart">

</canvas>


</section>









<!-- 新增错误 -->


<section class="card">


<h2>

记录一次投资错误

</h2>



<div class="form">


<input 
id="stock"
placeholder="股票/基金名称">


<input 
id="loss"
placeholder="亏损金额">


<select id="category">


<option>
追涨买入
</option>


<option>
恐慌卖出
</option>


<option>
仓位过重
</option>


<option>
没有研究公司
</option>


<option>
情绪交易
</option>


<option>
错误估值
</option>


</select>





<textarea 
id="reason"
placeholder="当时为什么买入？">

</textarea>





<textarea
id="mistake"
placeholder="真正错误在哪里？">

</textarea>





<textarea
id="lesson"
placeholder="以后如何避免？">

</textarea>



<button onclick="addMistake()">

保存记录

</button>


</div>


</section>









<!-- 搜索 -->


<section class="card">


<h2>

我的错误记录

</h2>


<input 
id="search"
placeholder="搜索股票或错误类型"
oninput="searchMistake()">


<div id="list">


</div>


</section>









<!-- 今日复盘 -->


<section class="card review">


<h2>

今日投资纪律

</h2>



<div class="check">

<input type="checkbox">

没有追涨


</div>



<div class="check">

<input type="checkbox">

控制仓位


</div>




<div class="check">

<input type="checkbox">

查看基本面


</div>



<div class="check">

<input type="checkbox">

记录交易理由


</div>



</section>






</div>



<script src="app.js"></script>


</body>


</html>
